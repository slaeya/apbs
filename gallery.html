<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery | Advanced Plasterboard Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-slate-900 font-['Inter']">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex flex-col leading-none group">
                <span class="text-lg md:text-xl font-bold tracking-tighter uppercase italic leading-none">
                    ADVANCED <span class="text-orange-600 font-black">PLASTERBOARD</span>
                </span>
                <span class="text-[9px] md:text-[10px] font-bold uppercase tracking-[0.5em] text-slate-400 group-hover:text-orange-600 transition mt-1">
                    SOLUTIONS
                </span>
            </a>
            <div class="hidden md:flex space-x-10 text-[11px] font-bold uppercase tracking-[0.2em] text-slate-500">
                <a href="index.html" class="hover:text-orange-600 transition">Home</a>
                <a href="services.html" class="hover:text-orange-600 transition">Services</a>
                <a href="gallery.html" class="text-orange-600 font-black">Projects</a>
                <a href="contact.html" class="bg-slate-900 text-white px-5 py-2 hover:bg-orange-600 transition">Enquire</a>
            </div>
            <a href="contact.html" class="md:hidden bg-slate-900 text-white px-4 py-2 text-xs font-bold uppercase">Enquire</a>
        </div>
    </nav>

    <section class="pt-40 pb-16 px-6 max-w-7xl mx-auto">
        <h1 class="text-4xl font-bold uppercase tracking-tighter">Project <span class="text-slate-300 font-light italic text-5xl">Portfolio</span></h1>
        <p class="mt-4 text-slate-500 max-w-2xl font-light leading-relaxed">A curated showcase of our high-end residential finishes and commercial fit-outs across Auckland.</p>
        <div class="h-1 w-12 bg-orange-600 mt-8"></div>
    </section>

    <section class="pb-32 px-6 max-w-7xl mx-auto">
        <div id="image-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="animate-pulse bg-slate-100 aspect-square"></div>
            <div class="animate-pulse bg-slate-100 aspect-square"></div>
            <div class="animate-pulse bg-slate-100 aspect-square"></div>
        </div>
    </section>

    <footer class="bg-slate-50 py-12 px-6 border-t">
        <div class="max-w-7xl mx-auto text-center">
            <p class="text-[9px] font-bold uppercase tracking-[0.3em] text-slate-400">&copy; 2024 Advanced Plasterboard Solutions Limited.</p>
        </div>
    </footer>

    <script>
        const user = 'slaeya'; 
        const repo = 'apbs'; 
        async function loadImages() {
            const grid = document.getElementById('image-grid');
            try {
                // Change ref=main to ref=dev if testing on dev branch
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/gallery?ref=dev`);
                const files = await response.json();
                grid.innerHTML = '';
                files.forEach(file => {
                    if(file.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                        const wrapper = document.createElement('div');
                        wrapper.className = "group overflow-hidden bg-slate-100 aspect-square relative cursor-pointer shadow-sm";
                        wrapper.innerHTML = `<img src="${file.download_url}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" loading="lazy">`;
                        grid.appendChild(wrapper);
                    }
                });
            } catch (e) {
                grid.innerHTML = '<p class="text-slate-400">Photos will appear here once uploaded to GitHub.</p>';
            }
        }
        loadImages();
    </script>
</body>
</html>
