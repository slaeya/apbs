<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio | Advanced Plasterboard Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white">
    <!-- (Include same Nav as above) -->

    <section class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
        <h2 class="text-4xl font-bold mb-4">Our Work</h2>
        <p class="text-slate-400 mb-12">A showcase of recent residential and commercial projects across Auckland.</p>

        <div id="image-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Images will load here automatically -->
        </div>
    </section>

    <script>
        // REPLACE THESE WITH YOUR GITHUB DETAILS
        const user = 'YOUR_GITHUB_USERNAME';
        const repo = 'YOUR_REPO_NAME';

        async function loadImages() {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/gallery`);
            const files = await response.json();
            const grid = document.getElementById('image-grid');
            
            files.forEach(file => {
                if(file.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                    grid.innerHTML += `
                        <div class="group overflow-hidden bg-slate-800 aspect-square">
                            <img src="${file.download_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        </div>`;
                }
            });
        }
        loadImages();
    </script>
</body>
</html>
