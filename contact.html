<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Advanced Plasterboard Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter']">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/95 backdrop-blur-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex flex-col leading-none group">
                <span class="text-lg md:text-xl font-bold tracking-tighter uppercase italic leading-none">
                    ADVANCED <span class="text-orange-600 font-black">PLASTERBOARD</span>
                </span>
                <span class="text-[9px] md:text-[10px] font-bold uppercase tracking-[0.5em] text-slate-400 group-hover:text-orange-600 transition mt-1">
                    SOLUTIONS
                </span>
            </a>
            <div class="hidden md:flex space-x-10 text-[11px] font-bold uppercase tracking-[0.2em] text-slate-500">
                <a href="index.html" class="hover:text-orange-600 transition">Home</a>
                <a href="services.html" class="hover:text-orange-600 transition">Services</a>
                <a href="gallery.html" class="hover:text-orange-600 transition">Projects</a>
                <a href="contact.html" class="text-orange-600 font-black">Contact</a>
            </div>
        </div>
    </nav>

    <section class="pt-40 pb-24 px-6 max-w-3xl mx-auto">
        <div class="bg-white p-8 md:p-12 shadow-2xl rounded-sm">
            <h1 class="text-3xl font-bold uppercase mb-2">Request a Quote</h1>
            <p class="text-slate-500 mb-8 font-light italic">Serving high-end residential and commercial projects across Auckland.</p>
            
            <form action="/submit" method="POST" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Name</label>
                    <input type="text" name="name" required class="w-full p-4 border border-slate-100 rounded-none focus:border-orange-600 outline-none transition">
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Email</label>
                        <input type="email" name="email" required class="w-full p-4 border border-slate-100 rounded-none focus:border-orange-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Phone</label>
                        <input type="tel" name="phone" required class="w-full p-4 border border-slate-100 rounded-none focus:border-orange-600 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Project Details</label>
                    <textarea name="message" rows="6" required class="w-full p-4 border border-slate-100 rounded-none focus:border-orange-600 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-5 uppercase tracking-[0.2em] hover:bg-orange-600 transition shadow-lg text-xs">
                    Send Project Enquiry
                </button>
            </form>
        </div>
    </section>
</body>
</html>
